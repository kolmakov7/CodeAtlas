services:
  coderag:
    image: ghcr.io/kolmakov7/codeatlas-coderag:latest
    build: .
    ports: ["8080:8080"]
    volumes: ["./data:/data"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CODERAG__DataDir: /data
      CODERAG__Embedding__Endpoint: http://llama-embeddings:8080/v1/embeddings
      # прокси/credentials — через env или /data/settings.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    user: "1000:1000"

  coderag-mcp:
    image: ghcr.io/kolmakov7/codeatlas-coderag-mcp:latest
    profiles: ["mcp"]
    volumes: ["./data:/data:ro"]
    environment:
      CODERAG__DataDir: /data
    depends_on: [coderag]
    restart: unless-stopped

  llama-embeddings:
    image: ghcr.io/ggerganov/llama.cpp:server
    profiles: ["embeddings"]
    volumes: ["./data/models:/models", "./scripts:/scripts:ro"]
    ports: ["8081:8080"]
    environment:
      MODEL_URL: https://huggingface.co/BAAI/bge-m3/resolve/main/bge-m3-Q8_0.gguf
      MODEL_FILE: /models/bge-m3-Q8_0.gguf
      LLAMA_ARGS: --embedding --port 8080 --threads 4
    entrypoint: ["/scripts/download-and-run.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
