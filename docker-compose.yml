services:
  coderag:
    image: ghcr.io/kolmakov7/codeatlas-coderag:latest
    build:
      context: .
      target: runtime
    ports: ["8085:8080"]
    volumes: ["./data:/data"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CODERAG__DataDir: /data
      # Dual embedding domains — two independent OpenAI-compatible endpoints.
      # Code and text vectors live in separate spaces. Point each at any external
      # service by overriding CODE_EMBEDDINGS_* / TEXT_EMBEDDINGS_* in .env.
      # Dimensions default to 0 (auto-detect from the first embedding response).
      Embeddings__Code__Endpoint: ${CODE_EMBEDDINGS_ENDPOINT:-http://code-embeddings:8080/v1/embeddings}
      Embeddings__Code__Model: ${CODE_EMBEDDINGS_MODEL:-bge-m3}
      Embeddings__Code__Dimensions: ${CODE_EMBEDDINGS_DIMENSIONS:-0}
      Embeddings__Text__Endpoint: ${TEXT_EMBEDDINGS_ENDPOINT:-http://text-embeddings:8080/v1/embeddings}
      Embeddings__Text__Model: ${TEXT_EMBEDDINGS_MODEL:-all-MiniLM-L6-v2}
      Embeddings__Text__Dimensions: ${TEXT_EMBEDDINGS_DIMENSIONS:-0}
      # прокси/credentials — через env или /data/settings.json
      # Storage: sqlite (default, files in /data) or postgresql (uses the `postgres` service).
      Storage__Provider: ${STORAGE__PROVIDER:-sqlite}
      Storage__Postgres__ConnectionString: ${STORAGE__POSTGRES__CONNECTIONSTRING:-Host=postgres;Port=5432;Database=coderag;Username=coderag;Password=coderag}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # coderag-mcp — deprecated: MCP теперь в основном API (http://coderag:8080/mcp, Streamable HTTP).
  # Отдельный образ не нужен (stdio не используется). Оставлен для совместимости stdio через `profiles: ["mcp"]`.
  coderag-mcp:
    image: ghcr.io/kolmakov7/codeatlas-coderag-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    profiles: ["mcp"]
    volumes: ["./data:/data:ro"]
    environment:
      CODERAG__DataDir: /data
      MCP_TRANSPORT: ${MCP_TRANSPORT:-both}
      ASPNETCORE_URLS: http://+:3001
      Embeddings__Code__Endpoint: ${CODE_EMBEDDINGS_ENDPOINT:-http://code-embeddings:8080/v1/embeddings}
      Embeddings__Code__Model: ${CODE_EMBEDDINGS_MODEL:-bge-m3}
      Embeddings__Code__Dimensions: ${CODE_EMBEDDINGS_DIMENSIONS:-0}
      Embeddings__Text__Endpoint: ${TEXT_EMBEDDINGS_ENDPOINT:-http://text-embeddings:8080/v1/embeddings}
      Embeddings__Text__Model: ${TEXT_EMBEDDINGS_MODEL:-all-MiniLM-L6-v2}
      Embeddings__Text__Dimensions: ${TEXT_EMBEDDINGS_DIMENSIONS:-0}
    depends_on: [coderag]
    restart: unless-stopped

  # Code vector space endpoint (OpenAI-compatible). Opt-in via the `embeddings` profile.
  # Override CODE_EMBEDDINGS_ENDPOINT to use any external service instead of this container.
  code-embeddings:
    image: ghcr.io/ggerganov/llama.cpp:server
    profiles: ["embeddings"]
    volumes: ["./data/models:/models", "./scripts:/scripts:ro"]
    ports: ["8081:8080"]
    environment:
      MODEL_URL: ${CODE_EMBEDDINGS_MODEL_URL:-https://huggingface.co/BAAI/bge-m3/resolve/main/bge-m3-Q8_0.gguf}
      MODEL_FILE: ${CODE_EMBEDDINGS_MODEL_FILE:-/models/bge-m3-Q8_0.gguf}
      LLAMA_ARGS: --embedding --port 8080 --threads 4
    entrypoint: ["/scripts/download-and-run.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # PostgreSQL with pgvector + pg_trgm — opt-in via the `postgres` profile.
  # Enable with STORAGE__PROVIDER=postgresql (e.g. in .env):
  #   docker compose --profile postgres up
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: coderag
      POSTGRES_USER: coderag
      POSTGRES_PASSWORD: coderag
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderag -d coderag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Text vector space endpoint (OpenAI-compatible). Opt-in via the `embeddings` profile.
  # Override TEXT_EMBEDDINGS_ENDPOINT to use any external service instead of this container.
  text-embeddings:
    image: ghcr.io/ggerganov/llama.cpp:server
    profiles: ["embeddings"]
    volumes: ["./data/models:/models", "./scripts:/scripts:ro"]
    ports: ["8082:8080"]
    environment:
      MODEL_URL: ${TEXT_EMBEDDINGS_MODEL_URL:-https://huggingface.co/QuantFactory/all-MiniLM-L6-v2-gguf/resolve/main/all-MiniLM-L6-v2-Q8_0.gguf}
      MODEL_FILE: ${TEXT_EMBEDDINGS_MODEL_FILE:-/models/all-MiniLM-L6-v2-Q8_0.gguf}
      LLAMA_ARGS: --embedding --port 8080 --threads 4
    entrypoint: ["/scripts/download-and-run.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
