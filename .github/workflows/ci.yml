name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodeAtlas.sln

      - name: Build
        run: dotnet build CodeAtlas.sln -c Release --no-restore

      - name: Test (coverage)
        run: dotnet test CodeAtlas.sln -c Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

      # Optional: setup-node + npm test + playwright (если Web UI)
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - run: npm ci
      #   working-directory: src/CodeRag.Web
      # - run: npm test
      #   working-directory: src/CodeRag.Web
      # - run: npx playwright test
      #   working-directory: tests/e2e

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          load: true
          tags: ghcr.io/kolmakov7/codeatlas-coderag:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MCP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: mcp
          push: false
          load: true
          tags: ghcr.io/kolmakov7/codeatlas-coderag-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push images (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/kolmakov7/codeatlas-coderag:latest
          docker push ghcr.io/kolmakov7/codeatlas-coderag-mcp:latest

      - name: Compose up & healthcheck
        run: |
          set -e
          mkdir -p ./data
          sudo chown -R 1000:1000 ./data 2>/dev/null || chmod -R 777 ./data
          # локальный образ уже загружен как ghcr.io/...:latest, не тянуть с registry
          docker compose -f docker-compose.yml up -d --pull never coderag
          # compose maps host 8085 -> container 8080 (see docker-compose.yml)
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8085/health/ready; then echo "ready"; ready=1; break; fi
            echo "waiting $i..."
            sleep 2
          done
          if [ "$ready" != "1" ]; then echo "coderag not ready"; docker compose logs coderag; docker compose down -v; exit 1; fi
          curl -fsS http://localhost:8085/health/live
          curl -fsS http://localhost:8085/api/health | head -c 5000; echo
          docker compose logs coderag

      - name: Compose down
        if: always()
        run: docker compose down -v

      # Optional: docker compose -f docker-compose.test.yml up --exit-code-from api-tests
      # - name: Integration tests via compose
      #   run: docker compose -f docker-compose.test.yml up --exit-code-from api-tests --abort-on-container-exit
