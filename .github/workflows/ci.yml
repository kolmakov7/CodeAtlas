name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodeAtlas.sln

      - name: Build
        run: dotnet build CodeAtlas.sln -c Release --no-restore

      - name: Test (coverage)
        run: dotnet test CodeAtlas.sln -c Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

      # Optional: setup-node + npm test + playwright (если Web UI)
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - run: npm ci
      #   working-directory: src/CodeRag.Web
      # - run: npm test
      #   working-directory: src/CodeRag.Web
      # - run: npx playwright test
      #   working-directory: tests/e2e

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: coderag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose up & healthcheck
        run: |
          docker compose -f docker-compose.yml up -d coderag
          for i in $(seq 1 30); do
            if curl -f http://localhost:8080/health/ready; then echo "ready"; break; fi
            echo "waiting $i..."
            sleep 2
          done
          curl -f http://localhost:8080/health/live
          curl -f http://localhost:8080/api/health
          docker compose logs coderag
          docker compose down -v

      # Optional: docker compose -f docker-compose.test.yml up --exit-code-from api-tests
      # - name: Integration tests via compose
      #   run: docker compose -f docker-compose.test.yml up --exit-code-from api-tests --abort-on-container-exit
